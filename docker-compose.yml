services:
  # Conteneur PHP-FPM avec Symfony
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: fantasyrealm_php
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - var_data:/var/www/html/var
    depends_on:
      - mysql
      - mongodb
    environment:
      DATABASE_URL: "mysql://fantasyrealm_user:fantasyrealm_pass@mysql:3306/fantasyrealm_db?serverVersion=8.0&charset=utf8mb4"
      MONGODB_URL: "mongodb://mongodb:27017"
      MONGODB_DB: "fantasyrealm_logs"
      MAILER_DSN: "smtp://mailpit:1025"
      APP_ENV: "dev"
    networks:
      - fantasyrealm

  # Serveur web Nginx
  nginx:
    image: nginx:alpine
    container_name: fantasyrealm_nginx
    ports:
      - "8090:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - fantasyrealm

  # Base de données MySQL 8
  mysql:
    image: mysql:8.0
    container_name: fantasyrealm_mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --init-connect="SET NAMES utf8mb4"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fantasyrealm_db
      MYSQL_USER: fantasyrealm_user
      MYSQL_PASSWORD: fantasyrealm_pass
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/02-data.sql:/docker-entrypoint-initdb.d/02-data.sql
      - ./database/03-seed-images.sql:/docker-entrypoint-initdb.d/03-seed-images.sql
    networks:
      - fantasyrealm

  # MongoDB pour les logs
  mongodb:
    image: mongo:latest
    container_name: fantasyrealm_mongodb
    ports:
      - "27019:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - fantasyrealm

  # Mailpit pour le test des mails en local
  mailpit:
    image: axllent/mailpit
    container_name: fantasyrealm_mailpit
    ports:
      - "8026:8025"
      - "1026:1025"
    networks:
      - fantasyrealm

volumes:
  mysql_data:
  mongo_data:
  vendor_data:
  var_data:

networks:
  fantasyrealm:
    driver: bridge
